<!DOCTYPE html>
<html>
<head>
  <title>Startup Hiring Game (Original)</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Load React, ReactDOM, and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #e5e7eb; /* Light gray background */
      margin: 0;
      font-family: Inter, sans-serif;
    }
    #root {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Removed confetti styles */
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Exact code from the first user message

    /**
     * @framerSupportedLayoutWidth auto
     * @framerSupportedLayoutHeight auto
     */
    function Game() { // Removed export default for inline script
        const [month, setMonth] = React.useState(1)
        const [budget, setBudget] = React.useState(200000)
        const [progress, setProgress] = React.useState(0)
        const [quality, setQuality] = React.useState(50)
        const [gameOver, setGameOver] = React.useState(false)
        const [ending, setEnding] = React.useState("")
        const [showTips, setShowTips] = React.useState(false)
        // Removed confetti state

        const choices = [
            {
                label: "🧑‍💼 Hire Locally",
                impact: { budget: -50000, progress: 10, quality: 10 },
                description: "Slow but high quality",
            },
            {
                label: "👨‍💻 Hire Freelancers",
                impact: { budget: -20000, progress: 20, quality: -10 },
                description: "Fast & cheap, but risky",
            },
            {
                label: "🚀 Hire POM Devs",
                impact: { budget: -30000, progress: 25, quality: 5 },
                description: "Smart, fast & reliable",
            },
        ]

        const getAvatarMood = () => {
            if (budget <= 0) return "😵"
            if (progress >= 100 && quality >= 50) return "😎"
            if (progress >= 100 && quality < 50) return "😬"
            if (progress > 50) return "😅"
            if (month > 4 && progress < 50) return "😭"
            return "🧐"
        }

        const makeChoice = (impact) => {
            const newBudget = budget + impact.budget
            const newProgress = progress + impact.progress
            const newQuality = quality + impact.quality
            const newMonth = month + 1

            setBudget(newBudget)
            setProgress(newProgress)
            setQuality(newQuality)
            // Check for game over conditions *before* setting state for the next turn
            let isGameOver = false;
            let endMessage = "";

            if (newProgress >= 100) {
                isGameOver = true;
                if (newQuality >= 50) {
                    endMessage = "🎉 You launched your MVP like a pro!";
                } else {
                    endMessage = "⚠️ You launched, but your tech debt is high.";
                }
            } else if (newBudget <= 0) {
                isGameOver = true;
                endMessage = "💀 You ran out of money before launching.";
            } else if (newMonth > 6) {
                isGameOver = true;
                endMessage = "💀 You ran out of time before launching.";
            }

            // Update state
            setBudget(newBudget)
            setProgress(newProgress)
            setQuality(newQuality)
            setMonth(newMonth)

            if (isGameOver) {
                setGameOver(true);
                setEnding(endMessage);
            }
        }

        const resetGame = () => {
            setMonth(1)
            setBudget(200000)
            setProgress(0)
            setQuality(50)
            setGameOver(false)
            setEnding("")
            setShowTips(false)
        }

        // Determine content based on game state
        let gameContent;
        if (gameOver) {
            gameContent = (
                <div
                    style={{
                        background: "#e0f2fe",
                        padding: 20,
                        borderRadius: 10,
                        textAlign: "center",
                        marginTop: 16, // Added margin
                    }}
                >
                    <p style={{ fontSize: 18, marginBottom: 16 }}>{ending}</p> {/* Added margin */}
                    {/* Final status summary */}
                         <ul
                            style={{
                                marginBottom: 16, // Added margin
                                fontSize: 13,
                                color: "#475569",
                                textAlign: "center", // Changed from left to center
                                listStyle: 'none',
                                paddingLeft: 0
                            }}
                    >
                        <li>
                            {progress >= 100
                                ? "✅ Finished MVP"
                                : "❌ Didn’t finish MVP"}
                        </li>
                        <li>
                            {quality >= 50
                                ? "✅ Solid Codebase"
                                : "⚠️ Low Tech Quality"}
                        </li>
                        <li>
                            {budget > 0
                                ? "💰 Still Cash in the Bank"
                                : "💸 Burned Out"}
                        </li>
                    </ul>
                    <button
                        onClick={resetGame}
                        style={{
                            // Removed marginTop: 16
                            padding: "10px 15px",
                            borderRadius: 6,
                            backgroundColor: "#4f46e5",
                            color: "#fff",
                            border: "none",
                            fontSize: 14,
                            cursor: "pointer",
                            display: "block",
                            width: "100%",
                        }}
                    >
                        🔄 Reset Game
                    </button>
                </div>
            );
        } else {
            gameContent = (
                <div>
                    {choices.map((choice, idx) => (
                        <button
                            key={idx}
                            onClick={() => makeChoice(choice.impact)}
                            style={{
                                display: "block",
                                marginBottom: 12,
                                width: "100%",
                                padding: "12px 16px",
                                borderRadius: 8,
                                backgroundColor: "#6366f1",
                                color: "#fff",
                                border: "none",
                                textAlign: "center", // Changed from left to center
                                fontSize: 14,
                                cursor: "pointer",
                                boxShadow: "0 2px 4px rgba(0,0,0,0.08)",
                            }}
                        >
                            <strong>{choice.label}</strong>
                            <br />
                            <span style={{ fontSize: 12, color: "#e0e7ff" }}>
                                {choice.description}
                            </span>
                        </button>
                    ))}
                    <button
                            onClick={() => setShowTips(!showTips)}
                            style={{
                                marginTop: 8,
                                background: "transparent",
                                border: "none",
                                fontSize: 13,
                                color: "#475569",
                                cursor: "pointer",
                                width: "100%", // Added width
                                textAlign: "center", // Added text align center
                            }}
                        >
                            ℹ️ What’s the best move?
                    </button>
                    {showTips && (
                        <div
                            style={{
                                fontSize: 12,
                                background: "#fef9c3",
                                padding: 10,
                                borderRadius: 6,
                                marginTop: 8,
                                color: "#92400e",
                                textAlign: "center", // Added center alignment
                            }}
                        >
                            Freelancers = cheap but risky.
                            <br />
                            Local = expensive and slow.
                            <br />
                            POM = fast, high-quality, lower cost.
                        </div>
                    )}
                </div>
            );
        }


        return (
            <div
                style={{
                    padding: 20,
                    fontFamily: "Inter, sans-serif",
                    backgroundColor: "#f9fafb",
                    borderRadius: 12,
                    width: 360, // Reduced width from 420px
                    // Removed minHeight from outer container
                    boxShadow: "0 4px 20px rgba(0,0,0,0.05)",
                    position: 'relative',
                }}
            >
                {/* Removed confetti rendering */}
                <h2 style={{ textAlign: "center", fontSize: 24, marginBottom: 10 }}>
                    Startup Hiring Game
                </h2>

                <p style={{ fontSize: 48, textAlign: "center", marginBottom: 8 }}>
                    {getAvatarMood()}
                </p>
                <p
                    style={{
                        textAlign: "center",
                        marginBottom: 20,
                        fontSize: 14,
                        color: "#64748b",
                    }}
                >
                    You, the stressed-out founder
                </p>

                {/* Stats always visible */}
                <div
                    style={{
                        marginBottom: 16,
                        display: "grid",
                        gap: 4,
                        fontSize: 14,
                        textAlign: "center", // Added center alignment
                    }}
                >
                    <p>
                        <strong>📆 Month:</strong> {month} / 6
                    </p>
                    <p>
                        <strong>💰 Budget:</strong> $
                        {budget.toLocaleString()}
                    </p>
                    <p>
                        <strong>📈 Progress:</strong> {progress}%
                    </p>
                    <div
                        style={{
                            background: "#e5e7eb",
                            height: 8,
                            borderRadius: 4,
                            overflow: "hidden",
                            marginBottom: 8,
                        }}
                    >
                        <div
                            style={{
                                width: `${progress}%`,
                                backgroundColor: "#4f46e5",
                                height: "100%",
                            }}
                        ></div>
                    </div>
                    <p>
                        <strong>🧪 Quality:</strong> {quality} / 100
                    </p>
                </div>

                {/* Render the determined game content within a wrapper for consistent height */}
                <div style={{ minHeight: 280 }}> {/* Added wrapper with minHeight */}
                  {gameContent}
                </div>

            </div> // Closing tag for main component div
        ); // Closing parenthesis for return
    } // Closing brace for Game function

    // Render the component defined above
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<Game />);
  </script>
</body>
</html>
